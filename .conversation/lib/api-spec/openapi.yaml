openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: DeviceBridge API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and registration
  - name: profile
    description: Current user profile
  - name: items
    description: Public and provider item workflows
  - name: requests
    description: Borrow, donation, sale, and loan requests
  - name: support
    description: Complaints and support messages
  - name: notifications
    description: Internal notifications
  - name: admin
    description: Admin review and impact metrics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    get:
      operationId: getSession
      tags: [auth]
      summary: Get current session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with name or IC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Invalid credentials
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End current session
      responses:
        "204":
          description: Logged out
  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Password changed
        "400":
          description: Invalid current password or new password
        "401":
          description: Authentication required
  /auth/register/user:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a regular user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistrationInput"
      responses:
        "201":
          description: Registered account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid or duplicate registration
  /auth/register/provider:
    post:
      operationId: registerProvider
      tags: [auth]
      summary: Register a provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderRegistrationInput"
      responses:
        "201":
          description: Registered provider account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: Invalid or duplicate registration
  /auth/appeals:
    post:
      operationId: submitAppeal
      tags: [auth]
      summary: Submit an appeal for a restricted account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealInput"
      responses:
        "201":
          description: Appeal submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAppeal"
        "400":
          description: Appeal is not available
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Authentication required
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update current profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid profile
    delete:
      operationId: deleteAccount
      tags: [profile]
      summary: Terminate the current account and allow future re-registration
      responses:
        "204":
          description: Account terminated
        "401":
          description: Authentication required
  /items:
    get:
      operationId: listItems
      tags: [items]
      summary: Search public approved items
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Category"
        - $ref: "#/components/parameters/Location"
        - $ref: "#/components/parameters/OfferType"
        - $ref: "#/components/parameters/Availability"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Public item list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
    post:
      operationId: createItem
      tags: [items]
      summary: Add a provider item for admin approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemInput"
      responses:
        "201":
          description: Pending item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "401":
          description: Provider authentication required
  /items/{id}:
    get:
      operationId: getItem
      tags: [items]
      summary: Get item details
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "200":
          description: Item details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
        "404":
          description: Item not found
    patch:
      operationId: updateItem
      tags: [items]
      summary: Edit an owned item and resubmit it
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /provider/items:
    get:
      operationId: listProviderItems
      tags: [items]
      summary: List current provider listings
      responses:
        "200":
          description: Provider items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
  /requests:
    get:
      operationId: listRequests
      tags: [requests]
      summary: List current user's requests
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Request"
    post:
      operationId: createRequest
      tags: [requests]
      summary: Request a donation, purchase, or loan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestInput"
      responses:
        "201":
          description: Created request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
  /provider/requests:
    get:
      operationId: listProviderRequests
      tags: [requests]
      summary: List requests for provider items
      responses:
        "200":
          description: Provider requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Request"
  /requests/{id}/decision:
    patch:
      operationId: decideRequest
      tags: [requests]
      summary: Provider approves or rejects a request and schedules a meeting
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
  /requests/{id}/cancel:
    patch:
      operationId: cancelRequest
      tags: [requests]
      summary: Cancel a pending or approved request
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelRequestInput"
      responses:
        "200":
          description: Cancelled request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
  /support/complaints:
    get:
      operationId: listComplaints
      tags: [support]
      summary: List current user's complaints
      responses:
        "200":
          description: Complaint list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Complaint"
    post:
      operationId: createComplaint
      tags: [support]
      summary: Report an issue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintInput"
      responses:
        "201":
          description: Complaint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
  /support/complaints/{id}/messages:
    post:
      operationId: replyToComplaint
      tags: [support]
      summary: Add a message to a complaint thread
      parameters:
        - $ref: "#/components/parameters/ComplaintId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List current user notifications
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Database-backed admin summary
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
  /admin/requests:
    get:
      operationId: listAdminRequests
      tags: [admin]
      summary: List pending requests for the admin action queue
      responses:
        "200":
          description: Pending requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Request"
        "401":
          description: Authentication required
  /admin/providers:
    get:
      operationId: listPendingProviders
      tags: [admin]
      summary: List providers pending verification
      responses:
        "200":
          description: Provider verification queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderReview"
  /admin/providers/{id}/decision:
    patch:
      operationId: decideProvider
      tags: [admin]
      summary: Approve or reject a provider
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "200":
          description: Provider review result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderReview"
  /admin/items:
    get:
      operationId: listPendingItems
      tags: [admin]
      summary: List items pending approval
      responses:
        "200":
          description: Item approval queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
  /admin/items/{id}/decision:
    patch:
      operationId: decideItem
      tags: [admin]
      summary: Approve or reject an item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionInput"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Item"
  /admin/complaints:
    get:
      operationId: listAdminComplaints
      tags: [admin]
      summary: List all complaints
      responses:
        "200":
          description: Complaint inbox
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Complaint"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List users and providers for moderation
      responses:
        "200":
          description: User moderation list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
  /admin/users/{id}/moderation:
    patch:
      operationId: moderateUser
      tags: [admin]
      summary: Ban or soft-delete a user or provider
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserModerationInput"
      responses:
        "200":
          description: Moderated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Invalid moderation action
  /admin/appeals:
    get:
      operationId: listAdminAppeals
      tags: [admin]
      summary: List account appeals
      responses:
        "200":
          description: Appeal inbox
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAppeal"
  /admin/appeals/{id}/decision:
    patch:
      operationId: decideAppeal
      tags: [admin]
      summary: Approve or reject an account appeal
      parameters:
        - $ref: "#/components/parameters/AppealId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppealDecisionInput"
      responses:
        "200":
          description: Updated appeal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAppeal"
  /impact:
    get:
      operationId: getImpact
      tags: [admin]
      summary: Calculate impact from real records
      responses:
        "200":
          description: Impact metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Impact"
components:
  parameters:
    ItemId:
      name: id
      in: path
      required: true
      schema: { type: number }
    RequestId:
      name: id
      in: path
      required: true
      schema: { type: number }
    ComplaintId:
      name: id
      in: path
      required: true
      schema: { type: number }
    ProviderId:
      name: id
      in: path
      required: true
      schema: { type: number }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: number }
    AppealId:
      name: id
      in: path
      required: true
      schema: { type: number }
    Search:
      name: q
      in: query
      schema: { type: string }
    Category:
      name: category
      in: query
      schema: { type: string }
    Location:
      name: location
      in: query
      schema: { type: string }
    OfferType:
      name: offer
      in: query
      schema: { type: string, enum: [DONATE, SELL, LEND] }
    Availability:
      name: availability
      in: query
      schema: { type: string }
    Sort:
      name: sort
      in: query
      schema: { type: string, enum: [newest, price_low, price_high] }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    Session:
      type: object
      properties:
        authenticated: { type: boolean }
        user:
          anyOf:
            - $ref: "#/components/schemas/Profile"
            - type: "null"
      required: [authenticated, user]
    LoginInput:
      type: object
      properties:
        identifier: { type: string, minLength: 1 }
        password: { type: string, minLength: 1 }
      required: [identifier, password]
    ChangePasswordInput:
      type: object
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8 }
      required: [currentPassword, newPassword]
    UserRegistrationInput:
      type: object
      properties:
        fullName: { type: string, minLength: 2 }
        icNumber: { type: string, minLength: 4 }
        age: { type: number, minimum: 1, maximum: 120 }
        dateOfBirth: { type: string, format: date }
        status: { type: string, enum: [STUDENT, WORKING] }
        occupation: { type: ["string", "null"] }
        position: { type: ["string", "null"] }
        school: { type: ["string", "null"] }
        password: { type: string, minLength: 8 }
      required: [fullName, icNumber, age, dateOfBirth, status, password]
    ProviderRegistrationInput:
      type: object
      properties:
        fullName: { type: string, minLength: 2 }
        icNumber: { type: string, minLength: 4 }
        operationLocation: { type: string, minLength: 2 }
        providerType: { type: string, enum: [BUSINESS, INDIVIDUAL] }
        shopName: { type: ["string", "null"] }
        shopLocation: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        contact: { type: ["string", "null"] }
        password: { type: string, minLength: 8 }
      required: [fullName, icNumber, operationLocation, providerType, password]
    Profile:
      type: object
      properties:
        id: { type: number }
        fullName: { type: string }
        role: { type: string, enum: [USER, PROVIDER, ADMIN] }
        username: { type: string }
        status: { type: ["string", "null"] }
        age: { type: ["number", "null"] }
        dateOfBirth: { type: ["string", "null"], format: date }
        occupation: { type: ["string", "null"] }
        position: { type: ["string", "null"] }
        school: { type: ["string", "null"] }
        providerType: { type: ["string", "null"] }
        operationLocation: { type: ["string", "null"] }
        shopName: { type: ["string", "null"] }
        shopLocation: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        contact: { type: ["string", "null"] }
        verificationStatus: { type: ["string", "null"] }
      required: [id, fullName, role, username]
    ProfileUpdate:
      type: object
      properties:
        fullName: { type: string, minLength: 2 }
        age: { type: ["number", "null"], minimum: 1, maximum: 120 }
        dateOfBirth: { type: ["string", "null"], format: date }
        occupation: { type: ["string", "null"] }
        position: { type: ["string", "null"] }
        school: { type: ["string", "null"] }
        operationLocation: { type: ["string", "null"] }
        shopName: { type: ["string", "null"] }
        shopLocation: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        contact: { type: ["string", "null"] }
    Item:
      type: object
      properties:
        id: { type: number }
        name: { type: string }
        category: { type: string }
        brand: { type: ["string", "null"] }
        year: { type: ["number", "null"] }
        age: { type: ["string", "null"] }
        condition: { type: string }
        originalPrice: { type: ["number", "null"] }
        salePrice: { type: ["number", "null"] }
        location: { type: string }
        quantity: { type: number }
        availableQuantity: { type: number }
        offers:
          type: array
          items: { type: string, enum: [DONATE, SELL, LEND] }
        loanMaxDays: { type: ["number", "null"] }
        depositRequired: { type: boolean }
        donationAnnouncementDate: { type: ["string", "null"], format: date }
        pendingRequestCount: { type: number }
        servedCount: { type: number }
        status: { type: string }
        rejectionReason: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        providerName: { type: string }
        providerShopName: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, name, category, condition, location, quantity, availableQuantity, offers, depositRequired, pendingRequestCount, servedCount, status, providerName, createdAt]
    ItemInput:
      type: object
      properties:
        name: { type: string, minLength: 2 }
        category: { type: string, minLength: 2 }
        brand: { type: ["string", "null"] }
        year: { type: ["number", "null"] }
        age: { type: ["string", "null"] }
        condition: { type: string }
        originalPrice: { type: ["number", "null"], minimum: 0 }
        salePrice: { type: ["number", "null"], minimum: 0 }
        location: { type: string, minLength: 2 }
        quantity: { type: number, minimum: 1 }
        offers:
          type: array
          minItems: 1
          items: { type: string, enum: [DONATE, SELL, LEND] }
        loanMaxDays: { type: ["number", "null"], minimum: 1 }
        depositRequired: { type: boolean }
        donationAnnouncementDate: { type: ["string", "null"], format: date }
        imageUrl: { type: ["string", "null"] }
      required: [name, category, condition, location, quantity, offers, depositRequired, donationAnnouncementDate]
    ItemUpdate:
      allOf:
        - $ref: "#/components/schemas/ItemInput"
    Request:
      type: object
      properties:
        id: { type: number }
        itemId: { type: number }
        itemName: { type: string }
        requesterName: { type: string }
        type: { type: string, enum: [DONATE, BUY, BORROW] }
        purpose: { type: string }
        phone: { type: ["string", "null"] }
        pickupLocation: { type: ["string", "null"] }
        requestedDays: { type: ["number", "null"] }
        startDate: { type: ["string", "null"] }
        endDate: { type: ["string", "null"] }
        meetingAt: { type: ["string", "null"] }
        returnAt: { type: ["string", "null"] }
        cancelledAt: { type: ["string", "null"] }
        cancelledBy: { type: ["string", "null"] }
        cancellationReason: { type: ["string", "null"] }
        requesterAge: { type: ["number", "null"] }
        requesterStatus: { type: ["string", "null"] }
        requesterOccupation: { type: ["string", "null"] }
        requesterPosition: { type: ["string", "null"] }
        requesterSchool: { type: ["string", "null"] }
        requesterDateOfBirth: { type: ["string", "null"] }
        status: { type: string }
        agreementStatus: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, itemId, itemName, requesterName, type, purpose, status, createdAt]
    RequestInput:
      type: object
      properties:
        itemId: { type: number }
        type: { type: string, enum: [DONATE, BUY, BORROW] }
        purpose: { type: string, minLength: 2 }
        phone: { type: ["string", "null"] }
        icNumber: { type: ["string", "null"] }
        pickupLocation: { type: ["string", "null"] }
        requestedDays: { type: ["number", "null"], minimum: 1 }
      required: [itemId, type, purpose]
    DecisionInput:
      type: object
      properties:
        decision: { type: string, enum: [APPROVED, REJECTED] }
        reason: { type: ["string", "null"] }
        meetingDate: { type: ["string", "null"] }
        meetingAt: { type: ["string", "null"] }
      required: [decision]
    CancelRequestInput:
      type: object
      properties:
        reason: { type: string, minLength: 2 }
      required: [reason]
    Complaint:
      type: object
      properties:
        id: { type: number }
        category: { type: string }
        description: { type: string }
        reporterName: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        status: { type: string, enum: [OPEN, IN_REVIEW, RESOLVED, CLOSED] }
        createdAt: { type: string }
        messages:
          type: array
          items: { $ref: "#/components/schemas/Message" }
      required: [id, category, description, status, createdAt, messages]
    ComplaintInput:
      type: object
      properties:
        category: { type: string }
        description: { type: string, minLength: 2 }
        phone: { type: ["string", "null"] }
      required: [category, description]
    Message:
      type: object
      properties:
        id: { type: number }
        authorName: { type: string }
        body: { type: string }
        createdAt: { type: string }
        fromAdmin: { type: boolean }
      required: [id, authorName, body, createdAt, fromAdmin]
    MessageInput:
      type: object
      properties:
        body: { type: string, minLength: 1 }
        status: { type: ["string", "null"] }
      required: [body]
    Notification:
      type: object
      properties:
